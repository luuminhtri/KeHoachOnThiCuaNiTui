<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173b6d">
  <title>Thời khóa biểu tuần</title>
  <style>
    :root {
      --navy:#173b6d; --navy-2:#28558f; --bg:#f4f7fb; --line:#d7e1ee;
      --text:#17243b; --muted:#66758c; --white:#fff; --purple:#eee5ff;
      --green:#e2f5e8; --orange:#ffe8dc; --blue:#e2efff; --yellow:#fff1c9;
      --shadow:0 12px 30px rgba(34,61,95,.12);
    }
    * { box-sizing:border-box; }
    html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
    body {
      margin:0; min-height:100vh;
      padding:max(14px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right))
              max(18px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
      background:radial-gradient(circle at top left,rgba(41,94,151,.08),transparent 30%),var(--bg);
      color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    }
    .page { max-width:1500px; margin:0 auto; }
    .hero { background:linear-gradient(135deg,var(--navy),var(--navy-2)); color:#fff; border-radius:24px; padding:22px 20px; box-shadow:var(--shadow); margin-bottom:16px; }
    h1 { margin:0; text-align:center; font-size:clamp(28px,5vw,46px); letter-spacing:.04em; line-height:1.12; }
    .subtitle { margin-top:8px; text-align:center; opacity:.88; font-size:clamp(13px,2vw,15px); }
    .today-panel { background:var(--white); border-radius:22px; padding:18px; box-shadow:var(--shadow); margin-bottom:16px; }
    .panel-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .panel-head h2 { margin:0; color:var(--navy); font-size:21px; }
    .panel-note { color:var(--muted); font-size:13px; margin-top:3px; }
    .today-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px; }
    .week-wrap { background:var(--white); border-radius:22px; padding:16px; box-shadow:var(--shadow); overflow:hidden; }
    .week-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; overflow-x:auto; padding-bottom:5px; }
    .day { min-width:210px; border:1px solid var(--line); border-radius:16px; overflow:hidden; background:#f9fbfe; }
    .day.today { border:2px solid var(--navy-2); box-shadow:0 5px 15px rgba(40,85,143,.14); }
    .day-head { background:var(--navy); color:#fff; padding:12px; text-align:center; font-weight:850; }
    .day-date { display:block; margin-top:3px; font-size:11px; opacity:.82; font-weight:650; }
    .day-body { padding:10px; display:flex; flex-direction:column; gap:9px; }
    .course { border-radius:13px; padding:11px; box-shadow:inset 0 0 0 1px rgba(30,60,100,.08); }
    .course.c1 { background:var(--purple); } .course.c2 { background:var(--green); }
    .course.c3 { background:var(--orange); } .course.c4 { background:var(--blue); }
    .course.c5 { background:var(--yellow); }
    .course.ongoing { outline:3px solid #2e9b57; }
    .course.finished { opacity:.62; }
    .course-name { font-size:15px; font-weight:850; line-height:1.3; }
    .course-code { color:#53627a; font-size:11px; font-weight:800; margin-top:3px; }
    .meta { display:grid; gap:4px; margin-top:8px; color:#53627a; font-size:12px; font-weight:700; }
    .badge { display:inline-block; width:max-content; margin-top:8px; padding:4px 8px; border-radius:999px; background:rgba(255,255,255,.68); font-size:11px; font-weight:850; text-decoration:none; }
    .badge.ongoing { color:#176f36; background:#dff5e6; }
    .badge.upcoming { color:#205f9d; background:#e4f1ff; }
    .badge.finished { color:#66758c; background:#edf0f4; }
    .empty { color:var(--muted); text-align:center; padding:22px 8px; font-size:13px; font-style:italic; }
    .legend { display:flex; flex-wrap:wrap; justify-content:center; gap:7px 14px; margin-top:13px; color:var(--muted); font-size:12px; }
    .legend b { color:var(--text); }
    @media (max-width:760px) {
      body { padding-top:max(10px,env(safe-area-inset-top)); }
      .hero { border-radius:20px; padding:19px 13px; }
      h1 { font-size:clamp(27px,9vw,37px); letter-spacing:.02em; }
      .today-panel,.week-wrap { border-radius:18px; padding:13px; }
      .week-grid { display:block; overflow:visible; }
      .day { margin-bottom:12px; }
      .day-body { display:grid; grid-template-columns:1fr; }
    }
    @media print {
      @page { size:landscape; margin:7mm; }
      body { background:#fff; padding:0; } .hero,.today-panel,.week-wrap { box-shadow:none; }
      .today-panel { display:none; } .week-grid { overflow:visible; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>THỜI KHÓA BIỂU TUẦN</h1>
      <div class="subtitle">Học kỳ 2026.1</div>
    </header>

    <section class="today-panel">
      <div class="panel-head">
        <div><h2>Lịch hôm nay</h2></div>
      </div>
      <div class="today-list" id="todayList"></div>
    </section>

    <section class="week-wrap">
      <div class="panel-head">
        <div><h2 id="weekTitle">Lịch tuần này</h2><div class="panel-note">Chỉ hiển thị những môn có lịch trong đúng tuần học.</div></div>
      </div>
      <div class="week-grid" id="weekGrid"></div>
      <div class="legend">
        <span><b>Lịch chung:</b> tuần 2–9, 11–18</span>
        <span><b>Computer Networks TN:</b> tuần 7, 9, 12, 14, 16</span>
        <span><b>Mốc tuần 1:</b> 31/08/2026</span>
      </div>
    </section>
  </main>

  <script>
    "use strict";
    const TIME_ZONE = "Asia/Ho_Chi_Minh";
    const SEMESTER_START_UTC = Date.UTC(2026, 7, 31);
    const START_TEACHING_WEEK = 2;
    const DAY_MS = 86400000;

    const schedule = [
      { id:"os", name:"Operating System", code:"IT3070E", type:"LT+BT", weekday:2, start:"14:10", end:"17:30", room:"C7-223", weeks:"2-9,11-18", color:"c1" },
      { id:"network-lab", name:"Computer Networks", code:"IT3080E", type:"TN", weekday:2, start:"09:15", end:"11:45", room:"B1-405", weeks:"7,9,12,14,16", color:"c2" },
      { id:"system-analysis", name:"Phân tích thiết kế hệ thống", code:"IT3120E", type:"LT+BT", weekday:3, start:"09:20", end:"11:45", room:"C7-115", weeks:"2-9,11-18", color:"c3" },
      { id:"mobile", name:"Mobile Programming", code:"IT4785E", type:"LT+BT", weekday:3, start:"12:30", end:"14:55", room:"D7-201", weeks:"2-9,11-18", color:"c4" },
      { id:"hcm-bt", name:"Tư tưởng Hồ Chí Minh", code:"SSH1151", type:"BT", weekday:3, start:"15:05", end:"17:30", room:"D6-306", weeks:"3,5,7,9,12,14,16,18", color:"c5" },
      { id:"hcm-lt", name:"Tư tưởng Hồ Chí Minh", code:"SSH1151", type:"LT", weekday:3, start:"15:05", end:"17:30", room:"D6-306", weeks:"2,4,6,8,11,13,15,17", color:"c5" },
      { id:"security", name:"Nhập môn An toàn thông tin", code:"IT4010E", type:"LT+BT", weekday:4, start:"12:30", end:"15:50", room:"C7-223", weeks:"2-9,11-18", color:"c2" },
      { id:"pingpong", name:"Bóng bàn 1", code:"PE2401", type:"LT+BT", weekday:5, start:"08:00", end:"09:00", room:"NTD", weeks:"2-9,11-18", color:"c5" },
      { id:"deep-learning", name:"Introduction to Deep Learning", code:"IT3320E", type:"LT+BT", weekday:5, start:"12:30", end:"14:55", room:"C7-223", weeks:"2-9,11-18", color:"c3" },
      { id:"network", name:"Computer Networks", code:"IT3080E", type:"LT+BT", weekday:5, start:"15:05", end:"17:30", room:"C7-223", weeks:"2-9,11-18", color:"c1" }
    ];

    const weekSets = new Map(schedule.map(item => [item.id, parseWeeks(item.weeks)]));
    const weekdayNames = ["", "Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7", "Chủ nhật"];
    const statusNames = { upcoming:"Sắp học", ongoing:"Đang học", finished:"Đã xong", scheduled:"Có lịch" };

    function parseWeeks(text) {
      const result = new Set();
      text.split(",").forEach(part => {
        const value = part.trim();
        if (value.includes("-")) {
          const [from,to] = value.split("-").map(Number);
          for (let week=from; week<=to; week++) result.add(week);
        } else if (value) result.add(Number(value));
      });
      return result;
    }

    function getVietnamNow(date = new Date()) {
      const values = {};
      new Intl.DateTimeFormat("en-CA", {
        timeZone:TIME_ZONE, year:"numeric", month:"2-digit", day:"2-digit",
        hour:"2-digit", minute:"2-digit", second:"2-digit", hourCycle:"h23"
      }).formatToParts(date).forEach(part => { if (part.type !== "literal") values[part.type] = Number(part.value); });
      return values;
    }

    function dateKey(parts) {
      return `${parts.year}-${String(parts.month).padStart(2,"0")}-${String(parts.day).padStart(2,"0")}`;
    }
    function dateKeyFromUTC(date) { return date.toISOString().slice(0,10); }
    function semesterWeek(parts) {
      const current = Date.UTC(parts.year, parts.month-1, parts.day);
      return Math.floor((current-SEMESTER_START_UTC)/(7*DAY_MS))+1;
    }
    function teachingWeek(semesterWeekNumber) {
      return semesterWeekNumber - START_TEACHING_WEEK + 1;
    }
    function weekday(parts) {
      const value = new Date(Date.UTC(parts.year,parts.month-1,parts.day)).getUTCDay();
      return value === 0 ? 7 : value;
    }
    function minutes(time) { const [h,m] = time.split(":").map(Number); return h*60+m; }
    function displayDate(key) { const [y,m,d] = key.split("-"); return `${d}/${m}/${y}`; }
    function mondayOfWeek(week) { return new Date(SEMESTER_START_UTC+(week-1)*7*DAY_MS); }

    function statusFor(item, isToday, nowMinutes) {
      if (!isToday) return "scheduled";
      if (nowMinutes < minutes(item.start)) return "upcoming";
      if (nowMinutes <= minutes(item.end)) return "ongoing";
      return "finished";
    }

    function courseCard(item, status) {
      const article = document.createElement("article");
      article.className = `course ${item.color} ${status}`;
      const title = document.createElement("div"); title.className="course-name"; title.textContent=item.name;
      const code = document.createElement("div"); code.className="course-code"; code.textContent=`${item.code} · ${item.type}`;
      const meta = document.createElement("div"); meta.className="meta";
      const time = document.createElement("span"); time.textContent=`◷ ${item.start}–${item.end}`;
      const room = document.createElement("span"); room.textContent=`⌖ ${item.room}`;
      const weeks = document.createElement("span"); weeks.textContent=`◫ Tuần ${item.weeks}`;
      const badge = document.createElement("span"); badge.className=`badge ${status}`; badge.textContent=statusNames[status];
      meta.append(time,room,weeks); article.append(title,code,meta,badge); return article;
    }

    function render() {
      const now = getVietnamNow();
      const key = dateKey(now); const week = semesterWeek(now); const todayWeekday = weekday(now);
      const nowMinutes = now.hour*60+now.minute;
      const todayItems = schedule.filter(item => item.weekday===todayWeekday && weekSets.get(item.id).has(week)).sort((a,b)=>minutes(a.start)-minutes(b.start));
      const todayList = document.getElementById("todayList"); todayList.replaceChildren();
      if (!todayItems.length) { const empty=document.createElement("div"); empty.className="empty"; empty.textContent="Hôm nay không có lịch học."; todayList.append(empty); }
      else todayItems.forEach(item => todayList.append(courseCard(item,statusFor(item,true,nowMinutes))));

      const studyWeek = teachingWeek(week);
      document.getElementById("weekTitle").textContent=studyWeek > 0 ? `Lịch tuần học thứ ${studyWeek}` : "Lịch học kỳ";
      const grid=document.getElementById("weekGrid"); grid.replaceChildren();
      const monday=mondayOfWeek(week);
      const activeDays = [...new Set(
        schedule.filter(item => weekSets.get(item.id).has(week)).map(item => item.weekday)
      )].sort((a,b) => a-b);
      for (const dayNo of activeDays) {
        const dayDate=new Date(monday.getTime()+(dayNo-1)*DAY_MS); const dayKey=dateKeyFromUTC(dayDate);
        const section=document.createElement("section"); section.className=`day${dayKey===key?" today":""}`;
        const head=document.createElement("div"); head.className="day-head"; head.textContent=weekdayNames[dayNo];
        const small=document.createElement("span"); small.className="day-date"; small.textContent=displayDate(dayKey); head.append(small);
        const body=document.createElement("div"); body.className="day-body";
        const items=schedule.filter(item => item.weekday===dayNo && weekSets.get(item.id).has(week)).sort((a,b)=>minutes(a.start)-minutes(b.start));
        if (!items.length) { const empty=document.createElement("div"); empty.className="empty"; empty.textContent="Không có lịch"; body.append(empty); }
        else items.forEach(item => body.append(courseCard(item,dayKey===key,nowMinutes)));
        section.append(head,body); grid.append(section);
      }
    }

    render();
    setInterval(render, 1000);
    window.timetableDebug = { schedule, parseWeeks, getVietnamNow, semesterWeek, teachingWeek, weekday, statusFor };
  </script>
</body>
</html>
